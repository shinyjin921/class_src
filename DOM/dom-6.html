<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세수량</title>
  <style>
    *{margin: 0; padding: 0;}
    main{
      width: 300px;
      margin: 1rem auto;
    }
    img{width: 100%;}
    .product{
      margin: 0.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap:1rem;
      button{
        width: 30px;
      }
      p{
        border: 1px solid #222;
        text-align: center;
        flex: 1;
      }
    }
  </style>
  <!-- dom구조가 만들어지면 script를 실행시켜라 -->
  <!-- <script src="./dom-6.js" defer></script> --> 
</head>
<body>
  <main>
    <img src="./images/img-01.png" alt="상품이미지">
    <div class="product">
      <button>-</button>
      <p>1</p>
      <button>+</button>
    </div>
  </main>
  <script src="./dom-6.js"></script>
</body>
</html>
